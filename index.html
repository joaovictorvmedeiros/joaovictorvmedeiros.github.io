    <script>

      // Escrito em JavaScript antigo (ES5) de propósito, para rodar em qualquer Safari.
      (function () {
        var erros = [];

          d.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;padding:24px;background:#121212;color:#f3e9d2;font:16px/1.5 -apple-system,Inter,Arial,sans-serif;z-index:99999;overflow:auto;-webkit-overflow-scrolling:touch';

            try {
